name: GitHub release

on:
  push:
    tags:
      - 'v0.1.2'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Run tests
        run: pnpm test

      - name: Verify built host
        run: pnpm run verify:host

      - name: Pack both release archives
        run: pnpm run pack:latest

      - name: Create GitHub Release
        run: |
          gh release create "$GITHUB_REF_NAME" "dsh-cache-bricks-${GITHUB_REF_NAME#v}.tgz" "dsh-cache-bricks.tgz" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file docs/release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
